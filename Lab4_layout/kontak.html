<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-form {
            max-width: 600px;
            margin: 20px 0;
        }

        .contact-form label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .contact-form input,
        .contact-form select,
        .contact-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .contact-form button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #20A759;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="container">
    <header>
        <h1>Contact</h1>
    </header>

    <nav>
        <a href="home.html">Home</a>
        <a href="artikel.html">Artikel</a>
        <a href="about.html">About</a>
        <a href="kontak.html" class="active">Kontak</a>
    </nav>

    <section id="hero">
        <h1>Hubungi Saya</h1>
        <p>Silakan isi formulir berikut untuk mengirim pesan.</p>
    </section>

    <section id="wrapper">
        <section id="main">
            <h2>Formulir Kontak</h2>

            <form class="contact-form" action="#" method="post">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama"
                       placeholder="Masukkan nama" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="Masukkan email" required>

                <label for="telepon">Nomor Telepon</label>
                <input type="tel" id="telepon" name="telepon"
                       placeholder="Masukkan nomor telepon">

                <label for="subjek">Subjek</label>
                <select id="subjek" name="subjek">
                    <option value="">Pilih subjek</option>
                    <option value="pertanyaan">Pertanyaan</option>
                    <option value="saran">Saran</option>
                    <option value="lainnya">Lainnya</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"
                          placeholder="Tulis pesan kamu..."
                          required></textarea>

                <button type="submit">Kirim Pesan</button>
            </form>
        </section>

        <aside id="sidebar">
            <div class="widget-box">
                <h3 class="title">Informasi Kontak</h3>
                <p>Gunakan formulir untuk menuliskan pertanyaan,
                saran, atau pesan.</p>
            </div>
        </aside>
    </section>

    <footer>
        <p>&copy; 2026 - Praktikum Pemrograman Web</p>
    </footer>
</div>
</body>
</html>
